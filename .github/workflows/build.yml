name: Flash App Final Working

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Ready Android Project
        run: |
          git clone https://github.com/android/architecture-components-samples.git app
          cd app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Replace with Simple App
        run: |
          rm -rf app/*
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/drawable

          # Copy your image
          cp app/src/main/res/drawable/bg.jpg app/src/main/res/drawable/bg.jpg || true

          cat > app/src/main/java/com/example/app/MainActivity.java << 'EOF'
          package com.example.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              boolean isOn = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout layout = new FrameLayout(this);
                  layout.setBackgroundColor(0xFF000000);

                  TextView text = new TextView(this);
                  text.setText("Flash Light ON");
                  text.setTextSize(24);
                  text.setTextColor(0xFFFFFFFF);
                  text.setGravity(17);

                  layout.addView(text);

                  layout.setOnClickListener(v -> {
                      if (!isOn) {
                          layout.setBackgroundResource(R.drawable.bg);
                          text.setText("");
                          isOn = true;
                      }
                  });

                  setContentView(layout);
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.app">

              <application android:label="FlashApp">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
