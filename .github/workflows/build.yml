name: Flash App Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/drawable

          # MainActivity
          cat > app/src/main/java/com/example/app/MainActivity.java << 'EOF'
          package com.example.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              boolean isOn = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout layout = new FrameLayout(this);
                  layout.setBackgroundColor(0xFF000000);

                  TextView text = new TextView(this);
                  text.setText("Flash Light ON");
                  text.setTextSize(24);
                  text.setTextColor(0xFFFFFFFF);
                  text.setGravity(17);

                  layout.addView(text);

                  layout.setOnClickListener(v -> {
                      if (!isOn) {
                          layout.setBackgroundResource(R.drawable.bg);
                          text.setText("");
                          isOn = true;
                      }
                  });

                  setContentView(layout);
              }
          }
          EOF

          # AndroidManifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.app">

              <application android:label="FlashApp">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # settings.gradle
          echo 'rootProject.name="FlashApp"' > settings.gradle
          echo "include ':app'" >> settings.gradle

          # Root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # App build.gradle
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace "com.example.app"
              compileSdkVersion 33

              defaultConfig {
                  applicationId "com.example.app"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
