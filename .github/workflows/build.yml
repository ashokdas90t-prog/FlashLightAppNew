name: Flash App Perfect Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Full App
        run: |
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/drawable

          # MainActivity
          cat > app/src/main/java/com/example/app/MainActivity.java << 'EOF'
          package com.example.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.hardware.camera2.CameraManager;
          import android.content.Context;

          public class MainActivity extends Activity {

              boolean isOn = false;
              CameraManager cameraManager;
              String cameraId;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout layout = new FrameLayout(this);
                  layout.setBackgroundColor(Color.BLACK);

                  TextView text = new TextView(this);
                  text.setText("Flash Light ON");
                  text.setTextSize(24);
                  text.setTextColor(Color.WHITE);
                  text.setGravity(17);

                  layout.addView(text);

                  cameraManager = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                  try {
                      cameraId = cameraManager.getCameraIdList()[0];
                  } catch (Exception e) {}

                  layout.setOnClickListener(v -> {
                      try {
                          if (!isOn) {
                              cameraManager.setTorchMode(cameraId, true);
                              layout.setBackgroundResource(R.drawable.bg);
                              isOn = true;
                          } else {
                              cameraManager.setTorchMode(cameraId, false);
                              layout.setBackgroundColor(Color.BLACK);
                              isOn = false;
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  });

                  setContentView(layout);
              }
          }
          EOF

          # Manifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.app">

              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.FLASHLIGHT"/>

              <application
                  android:label="FlashApp"
                  android:theme="@android:style/Theme.Black.NoTitleBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          # Gradle config
          echo 'rootProject.name="FlashApp"' > settings.gradle
          echo "include ':app'" >> settings.gradle

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace "com.example.app"
              compileSdkVersion 33

              defaultConfig {
                  applicationId "com.example.app"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

          # Install correct Gradle
          curl -L https://services.gradle.org/distributions/gradle-7.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          mv gradle-7.5 gradle-home

      - name: Build APK
        run: ./gradle-home/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
