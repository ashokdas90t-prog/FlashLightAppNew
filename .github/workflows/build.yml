name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:
  push:
    paths:
      - "base.apk"
      - "split_config.arm64_v8a.apk"
      - "split_config.en.apk"
      - "split_config.xxhdpi.apk"
      - ".github/workflows/analyze-flashfy-aot-v4.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check APK inputs
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk
          do
            test -s "$f" || {
              echo "Missing APK: $f"
              exit 1
            }
          done

          echo "APK inputs: PASS"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APKEditor
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar" \
            -o APKEditor.jar

          test -s APKEditor.jar

      - name: Merge original split APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work

          mkdir -p \
            work/splits \
            work/info \
            work/native \
            work/decompile \
            work/focused

          cp \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk \
            work/splits/

          java -Xmx4g -jar APKEditor.jar \
            m \
            -i work/splits \
            -o work/flashfy.apk

          test -s work/flashfy.apk

          unzip -l work/flashfy.apk \
            | grep -q "lib/arm64-v8a/libapp.so"

          echo "Merged APK: PASS"

      - name: Download matching flutterdec release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v0.1.0-alpha.4"
          ARCHIVE="flutterdec-${VERSION}-Linux-X64.tar.gz"

          curl -fL \
            "https://github.com/caverav/flutterdec/releases/download/${VERSION}/${ARCHIVE}" \
            -o "work/${ARCHIVE}"

          test -s "work/${ARCHIVE}"

          mkdir -p work/flutterdec

          tar -xzf \
            "work/${ARCHIVE}" \
            -C work/flutterdec

          echo "=== RELEASE LAYOUT ==="

          find work/flutterdec \
            -maxdepth 8 \
            -type f \
            -print \
            | sort

          FLUTTERDEC_BIN="$(
            find work/flutterdec \
              -type f \
              -path '*/bin/flutterdec' \
              -print \
              -quit
          )"

          if [ -z "$FLUTTERDEC_BIN" ]; then
            FLUTTERDEC_BIN="$(
              find work/flutterdec \
                -type f \
                -name flutterdec \
                -print \
                -quit
            )"
          fi

          test -n "$FLUTTERDEC_BIN" || {
            echo "ERROR: flutterdec binary not found."
            exit 1
          }

          chmod +x "$FLUTTERDEC_BIN"

          FLUTTERDEC_BIN="$(realpath "$FLUTTERDEC_BIN")"

          echo "FLUTTERDEC_BIN=$FLUTTERDEC_BIN" >> "$GITHUB_ENV"

          echo "Using release binary:"
          echo "$FLUTTERDEC_BIN"

          "$FLUTTERDEC_BIN" --version

          echo "=== RELEASE DATA ==="

          BIN_DIR="$(dirname "$FLUTTERDEC_BIN")"
          PREFIX_DIR="$(dirname "$BIN_DIR")"

          find "$PREFIX_DIR" \
            -maxdepth 8 \
            -type f \
            \( \
              -name registry
